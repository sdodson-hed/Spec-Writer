name: tests

# Runs the pytest suite on every pull request and on pushes to main.
# The 431-master WBDG corpus gate is not run here (the corpus lives outside
# the repo); run scripts/audit_corpus.py locally and paste its summary line
# into the PR description.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]  # oldest supported, newest
    steps:
      # Action majors that run on Node 24 (the v4/v5 majors targeted Node 20,
      # which GitHub runners deprecated in 2025)
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The edit-mode and subsection JS tests run under Node and skip without
      # it. Node 22 is the maintained LTS (Node 20 reached end of life).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q -rs
